# 工具栏
tool_bar:
  button_spacing: 5 # 按钮间距

  # 左侧固定主按钮配置
  primary_button:
    # 背景样式设置
    background:
      type: circle # 高亮形状 (可选值: circle|rectangle)
      corner_radius: 10 # 圆角半径
      normal: 0x00 # 正常状态背景颜色（3.3.12 字段名是 normal，旧名 bg_normal 会被静默忽略）
      highlight: hilited_candidate_button_color # 高亮状态背景色（旧名 bg_highlight 同样已失效）
      vertical_inset: 4 # 垂直方向内缩量
      horizontal_inset: 0 # 水平方向内缩量
    # 前景内容设置
    foreground:
      style: "ic@dots_horizontal" # 内置质感设计图标样式（以ic@开头）
      normal: candidate_text_color # 正常状态前景色（旧名 fg_normal 已失效；本地图片不允许着色）
      padding: 10 # 前景内容与背景边界的内边距
    # 按钮点击事件
    action: menu_keyboard

  hide_button: &hide_button
    foreground:
      style: "ic@keyboard_close"
      normal: candidate_text_color
    action: Hide

  emoji_button: &emoji_button
    foreground:
      style: "ic@emoticon"
    # 前景样式可以为空，使用默认样式，按钮将显示为 action 的 label
    action: liquid_keyboard_emoji

  clipboard_button: &clipboard_button
    foreground:
      style: "ic@clipboard"
    action: clipboard_window

  ascii_mode_button: &ascii_mode_button
    foreground:
      option_styles: ["中", "En"] # 样式也可以为表，将根据 action 的 toggle 决定
      font_size: 18 # 按钮字体大小
      padding: 10
    action: Mode_switch

  move_button: &move_button
    foreground:
      style: "ic@cursor_text"
    action: Keyboard_move

  # 同步：两件事一起做 ——
  #   1) 把【外部存储】/storage/emulated/0/rime 的改动搬进同文真正读写的【私有目录】
  #      （Android/data/com.osfans.trime/files/rime）。PC 上的改动经 Syncthing 只到得了外部存储，
  #      这一搬是必须的，见 README 第四节实测；
  #   2) 把 sync/<设备id>/ 下各设备的 userdb 快照合并进本机词库（词频/输入习惯）。
  # 之后引擎会重启，配置与词库改动同时生效。
  # 图标用单圈箭头的 ic@refresh（ic@sync 是双箭头，跟菜单里的「更新配置」撞脸）
  sync_button: &sync_button
    foreground:
      style: "ic@refresh"
    action: Sync

  # 图标名走 MDI 命名：ic@xxx -> cmd_xxx；不认识的名字会显示空白

  # 右侧按钮列表（从右向左排列）
  buttons:
    [
      *hide_button,
      *emoji_button,
      *clipboard_button,
      *move_button,
      *ascii_mode_button,
      *sync_button,
    ]

#键盘布局
preset_keyboards:
  default:
    author: "暖暖"
    name: 26键默认布局
    width: 10
    height: 32
    label_transform: uppercase
    ascii_mode: 0
    keys:
      - { click: q, long_click: 1, swipe_up: "1", swipe_down: AppQQ, hint: "QQ" }
      - { click: w, long_click: 2, swipe_up: "2", swipe_down: AppWeChat, hint: "微信" }
      - { click: e, long_click: 3, swipe_up: "3", swipe_down: CtrlE, hint: "翻译" }
      - { click: r, long_click: 4, swipe_up: "4", swipe_down: RepeatCommit, hint: "重复" }
      # T 下滑＝插入当前日期时间戳（不含秒），如 2026-10-14 16:00
      - { click: t, long_click: 5, swipe_up: "5", swipe_down: Timestamp, hint: "时间" }
      - { click: y, long_click: 6, swipe_up: "6" }
      - { click: u, long_click: 7, swipe_up: "7" }
      - { click: i, long_click: 8, swipe_up: "8" }
      - { click: o, long_click: 9, swipe_up: "9", swipe_down: AppObsidian, hint: "Ob" }
      - { click: p, long_click: 0, swipe_up: "0", swipe_down: CtrlP, hint: "拆字" }

      # Ctrl：借 A 左边那 5% 空隙放一个细 Ctrl，A 的位置完全不动；点按挂起 Control、再点取消
      - { width: 5 }
      - { click: a, long_click: select_all, swipe_up: select_all }
      - { click: s, long_click: "+", swipe_up: "+", swipe_down: CtrlS, hint: "保存" }
      - { click: d, long_click: "-", swipe_up: "-", swipe_down: AppDouyin, hint: "抖音" }
      # F：下滑＝用浏览器搜（必应）。取的是「光标前的内容」，不取选区（实测）
      - { click: f, long_click: CtrlF, swipe_up: CtrlF, swipe_down: Bing, hint: "必应" }
      - { click: g, long_click: "|", swipe_up: "|" }
      # H：左滑＝收起/展开「符号」小字，下滑＝收起/展开「注解」小字（各是开关，再触发恢复）
      #    一个键只能跑一个 command，没有"同时藏两个"的命令，所以拆成两个方向
      - { click: h, long_click: CtrlH, swipe_up: CtrlH, hint: "隐藏", swipe_left: HideSymbols, swipe_down: HideHints }
      # J：长按/上滑=成对括号、光标居中（跟随中英文：中文态 （）、英文态 ()）；
      #    下滑=反查（把当前候选注释上屏，与小狼毫物理 Ctrl+J 同效），注解“反查”
      #    写法同 K：ASCII 字面量交给 Rime punctuator 做状态转换；
      #    label_symbol 固定写 （），因为键面符号槽不随状态变（hint/label_symbol 同理）
      - click: j
        long_click: '(){Left}'
        swipe_up: '(){Left}'
        swipe_down: CtrlJ
        hint: "反查"
        label_symbol: "（）"
      # K：长按/上滑=成对的双引号（光标居中，跟随中英文：中文态 “” 、英文态 ""）
      #    实测（2026-10-15，同文 3.3.11）：ascii 子块是**单个动作 token**（KeyActionToken），
      #    里面的 long_click/swipe_up 会被丢弃——它只能改「单击」，改不了手势。
      #    而且手势一旦在主键定义了，英文态也永远用主键动作（KeyView→Key.getAction 短路）。
      #    ✅ 正确做法：手势动作只写 **ASCII 字面量** ""{Left}——ASCII 字符走
      #    simulateKeySequence → Rime process_key，由 punctuator 按状态转换：
      #    中文态自动成 “”，英文态原样 ""（J 的上滑 () 一直是这么生效的）。
      #    ⚠️ 不要写中文引号字面量（“” 不走 Rime，直接 commitText，永远中文引号）；
      #    ⚠️ 也不要用预设键 text: "“{Left}”" —— text 里 {Left} 按字面输出（见配置笔记 §5）。
      - click: k
        long_click: '""{Left}'
        swipe_up: '""{Left}'
        swipe_down: CtrlL

      # L：长按/上滑=分号；下滑=Ctrl+L（整字拆分，Obsidian 里切换待办状态）
      - { click: l, long_click: ";", swipe_up: ";", swipe_down: CtrlL, hint: "拆字" }
      - { width: 4 }
      - { width: 1 }

      # 上滑/双击＝大写锁定（键面两种状态同色，区分不了，靠手势区分）
      - { click: Shift_L, double_click: Shift_L3, swipe_up: Shift_L3, width: 15, key_back_color: bc1, key_text_color: tc1 }
      - { click: z, long_click: "@", swipe_up: "@" }
      - { click: x, long_click: cut, swipe_up: cut }
      - { click: c, long_click: copy, swipe_up: copy }
      # V：长按/上滑=同文剪贴板直贴（不依赖 App 支持 Ctrl+V）；下滑=Ctrl+V（走 App/系统剪贴板）
      - { click: v, long_click: paste_clip, swipe_up: paste_clip, swipe_down: paste, hint: "CtrlV" }
      # B：长按/上滑=冒号；下滑=Ctrl+B（Obsidian/Markdown 加粗），注解“加粗”
      - { click: b, long_click: ":", swipe_up: ":", swipe_down: CtrlB, hint: "加粗" }
      - { click: n, long_click: "\\", swipe_up: "\\", swipe_down: CtrlN, hint: "新建" }
      - { click: m, long_click: "_", swipe_up: "_", swipe_down: MT_manager, hint: "MT" }
      # 退格：上滑=Esc（符号槽写 Esc）、下滑=撤销（注解槽写 撤销）
      # 退格：上滑=Esc、下滑=撤销、长按=持续删（BackSpace2 预设键自带的 repeatable + slide_delete）
      # 注：这里不要再挂 popup —— 弹条会和「长按连删」抢手势，结果是长按没反应
      - {
          click: BackSpace2,
          width: 15,
          key_back_color: bc2,
          key_text_color: tc2,
          swipe_up: Escape,
          swipe_down: undo,
          label_symbol: "Esc",
          hint: "撤销",
        }

      # 底排：123 | Ctrl | ， | 空格 | / | 中英 | Enter
      # 123：点按＝数字区；上滑＝符号区（常用）；长按弹条＝「符号 / 换人」
      # 双击做不了：点按已把键盘切成数字区，第二次点击落在数字键盘上（实测）。
      # 注：123 不挂 long_click —— 弹条和 long_click 同时存在会让弹条变慢
      - {
          click: Keyboard_number,
          popup: [Symbols_panel, Color_switch, Theme_settings],
          swipe_up: Symbols_panel,
          label_symbol: "符号",
          width: 14,
        }
      - { click: ",", label: "，", ascii_label: ",", long_click: ".", swipe_up: ".", width: 17 }
      - { click: space, long_click: Mode_switch, swipe_up: Mode_switch, width: 38, key_back_color: bc3, key_text_color: tc3, key_text_size: 27 }
      - { click: "/", long_click: "?", swipe_up: "?", width: 17 }
      # Enter：点按回车；长按弹条「同文设置 / 系统设置 / 开发者选项」
      # 弹条按「离手指最近的排第一，其余往另一侧排」——Enter 在右边缘，所以是往左依次排，
      # 松手＝同文设置，左滑一点＝系统设置，再左滑＝开发者选项
      # （翻译 Ctrl+E 已挪到 E 的下滑）
      - {
          click: Return,
          composing: Return1,
          popup: [Settings, SysSettings, DevSettings],
          swipe_up: Settings,
          label_symbol: "设置",
          width: 14,
          key_back_color: bc4,
          key_text_color: tc4,
        }

      # ↓↓↓ 仅 my 版：底部一排修饰键（Ctrl / Tab / Alt），33/34/33 三等分、压矮（改 ms.trime.yaml 请勿改这里）
      - { click: Ctrl_L2, label: "Ctrl", width: 33, height: 16 }
      - { click: Tab_L, label: "Tab", width: 34, height: 16 }
      - { click: Alt_L2, label: "Alt", width: 33, height: 16 }

  number:
    author: "暖暖"
    name: 数字+
    width: 20
    height: 40
    ascii_mode: 1
    keys:
      - { click: "/", long_click: "[]{Left}", swipe_up: "[]{Left}", width: 13 }
      - { click: "+", long_click: "{}{Left}", swipe_up: "{}{Left}", width: 13 }
      - { click: 1 }
      - { click: 2 }
      - { click: 3 }
      - { click: "=", long_click: V_calc, swipe_up: V_calc, width: 13 }

      - { click: "*", long_click: "<>{Left}", swipe_up: "<>{Left}", width: 13 }
      - { click: "-", long_click: "《》{Left}", swipe_up: "《》{Left}", width: 13 }
      - { click: 4 }
      - { click: 5 }
      - { click: 6 }
      - { click: space_c, long_click: C_calc, swipe_up: C_calc, key_back_color: bc3, key_text_color: tc3, width: 13 }

      - { click: "%", long_click: "''{Left}", swipe_up: "''{Left}", width: 13 }
      - { click: "×", long_click: "^", swipe_up: "^", width: 13 }
      - { click: 7, long_click: select_all }
      - { click: 8, long_click: copy }
      - { click: 9, long_click: paste_clip, swipe_down: paste }
      - {
          click: BackSpace2,
          width: 13,
          key_back_color: bc2,
          key_text_color: tc2,
          swipe_up: Escape,
          swipe_down: undo,
        }

      - { click: Keyboard_default, width: 13, key_back_color: bc4, key_text_color: tc4 }
      - { click: "÷", long_click: "……", swipe_up: "……", width: 13 }
      - { click: liquid_keyboard_switch, long_click: Color_switch, key_back_color: bc1, key_text_color: tc1 }
      - { click: 0, long_click: cut }
      - { click: ., long_click: N_date, swipe_up: N_date }
      - { click: Return, width: 13, key_back_color: bc4, key_text_color: tc4 }

  move:
    author: "暖暖"
    name: 光标控制
    width: 20
    height: 40
    keys:
      # 2026-10-25：照原版 ms 的 editor 键盘改——四行光标键 + 最底一整条「返回」长键
      # （原版 editor 的最后一行就是 width: 100 的 Keyboard_default）。
      # 左列固定为 全选 / 剪切 / 复制 / Ctrl；其余格子沿用原来的光标键与空格。
      - { click: select_all, label: 全选 }
      - { click: Doc_Home, label: 文首 }
      - { click: Up, label: "↑", repeatable: true }
      - { click: Doc_End, label: 文末 }
      - { click: paste, label: 粘贴 }

      - { click: cut, label: 剪切 }
      - { click: Left, label: "←", repeatable: true, long_click: Left1, swipe_up: Left1 }
      - { click: Shift_L2, label: 选择 }
      - { click: Right, label: "→", repeatable: true, long_click: Right1, swipe_up: Right1 }
      - { click: Delete_cn, long_click: DeleteCandidate, swipe_up: DeleteCandidate }

      - { click: copy, label: 复制 }
      - { click: Home_cn }
      - { click: Down, label: "↓", repeatable: true }
      - { click: End_cn }
      - { click: BackSpace2, label: "⌫", repeatable: true, long_click: CtrlBackspace, swipe_up: CtrlBackspace, key_back_color: bc2, key_text_color: tc2 }

      # Ctrl：单击挂起 Control（之后按 ←/→ 变 Ctrl+←/→ 跳词）
      - { click: Ctrl_L2, label: "Ctrl" }
      - { click: undo, label: 撤销 }
      # 空格：点按＝空格；长按/上滑＝Tab；键面沿用 space 的长横，符号槽小字 Tab
      # 用 space_c 而不是 space：space 带 repeatable/slide_cursor，键级长按和上滑会被吃掉
      - {
          click: space_tab,
          label_symbol: "Tab",
          long_click: Tab,
          swipe_up: Tab,
          key_back_color: bc3,
          key_text_color: tc3,
        }
      - { click: redo, label: 重做 }
      - { click: Return, key_back_color: bc4, key_text_color: tc4 }

      # 底部长条返回：整行一个键（width: 100 占满 20 格），同原版 editor 的收尾行
      # height 只是相对权重（4×40 + 24 = 184，按 keyboard_height 比例分），比内容行矮一半
      - {
          click: Keyboard_default,
          label: 返回,
          width: 100,
          height: 24,
          key_back_color: bc4,
          key_text_color: tc4,
        }

preset_keys:
  # 下滑 M 打开 MT 管理器（Trime 的 run 只吃「包名」或「包名/组件名」，不能带文件路径）
  MT_manager: { label: MT, functional: false, send: FUNCTION, command: run, option: "bin.mt.plus" }

  # 安卓
  BRIGHTNESS_DOWN: { label: 亮度-, send: BRIGHTNESS_DOWN }
  BRIGHTNESS_UP: { label: 亮度+, send: BRIGHTNESS_UP }
