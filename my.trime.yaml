# Trime custom style settings
# encoding: utf-8

config_version: "3.0"
name: 全键 #方案名称
author: lost-42 #作者信息

#界面风格、功能开关
style:
  auto_caps: false #自動句首大寫:true|false|ascii
  root_background: keyboard_back_color # 整个键盘区+候选栏的背景图/色
  candidate_font: han.ttf #候选字体
  candidate_padding: 5 #候选项内边距
  candidate_spacing: 0.5 #候选间距
  candidate_text_size: 18 #候选字号
  candidate_view_height: 28 #候选区高度
  color_scheme: shiqing #配色方案（石青=亮色，它自己写了 dark_scheme: songyan）
  # 跟随系统日夜：同文设置 →「键盘样式」→ 打开「跟随系统夜间模式」，
  # 并在「配色」里选中 石青。注意界面里选的配色会覆盖这一行。
  comment_font: comment.ttf #编码提示字体
  comment_height: 14 #编码提示区高度
  comment_position: right #编码提示布局：right|top|overlay（3.3 用它取代旧 comment_on_top）
  comment_text_size: 10 #编码提示字号（“标准”就是 10；再大就把候选挤成一条）
  hanb_font: hanb.ttf #扩充字体
  horizontal: true #水平模式
  horizontal_gap: 8 #键水平间距
  # 候选窗交给 3.3 内置渲染。旧版这一整段（layout: 的 max_length/max_width/sticky_lines/
  # max_entries/all_phrases…，以及 window: 的模板列表）在 3.3 里都不再被读取，留着只会
  # 让人以为能调；旧模板还会让候选窗按模板宽度算，长候选（DeepSeek Harness）只露出一条。
  # 2026-10-19 整段删除，改用文件末尾同名的 preedit:/window: 新写法。
  key_font: symbol.ttf #键盘字体
  key_long_text_size: 16 #长标签字号
  key_text_size: 20 #键字号
  key_width: 10.0 #键宽，占屏幕宽的百分比
  keyboards: [.default, number, edit, move, numberb] #键盘配置
  # label_text_size: 22 #标签字号
  label_font: label.ttf #编标签字体
  latin_font: latin.ttf #西文本体
  latin_locale: en_US #西文语言
  locale: zh_CN #缺省语言 zh_TW,zh_CN,zh_HK,""
  keyboard_height: 290 #锁定键盘高度，避免切换时键盘高度变化而造成闪烁
  keyboard_height_land: 200 #锁定横屏下键盘高度，避免切换时键盘高度变化而造成闪烁
  key_symbol_offset_x: -5
  key_symbol_offset_y: 3
  preview_font: latin.ttf #按键提示字体
  preview_height: 56 #按键提示高度
  preview_offset: -32 #按键提示纵向偏移
  preview_text_size: 40 #按键提示字号
  # 长按弹条（popup: [...]）的尺寸：3.3.12 走 popup_* 这一组键，缺了它们弹条尺寸为 0、也就是「看不见」。
  # preview_* 只管按下时的大气泡，和弹条不是同一组参数。
  popup_font: latin.ttf #弹条字体
  # ⚠️ 实测：弹条里每个键**只显示 label 的首字符**（用 ASCII 标签 "AAAA" 验证过 → 只显示 A）。
  #    所以 label 写「系统」「开发者」，弹条里实际只看得见「系」「开」。
  #    这不是宽度截断——把 popup_width 从 56 加到 90 毫无变化，是「只取首字」的设计。
  popup_width: 56 #弹条里每个候选键的宽度
  popup_height: 52 #弹条高度
  popup_bottom_margin: 68 #弹条距底部偏移
  popup_key_height: 52 #弹条内按键高度
  popup_text_size: 20 #弹条字号
  proximity_correction: true #按键纠错
  reset_ascii_mode_on_focus_change: false #焦点变更弹起软键盘时，是否重置 ascii_mode（3.3.10 起由 reset_ascii_mode 更名而来）
  round_corner: 8 #按键圆角半径
  shadow_radius: 0.0 #按键阴影半径
  speech_opencc_config: none #语音输入简繁转换
  symbol_font: symbol.ttf #符号字体
  symbol_text_size: 10 #符号字号
  text_font: latin.ttf #编码字体
  text_size: 14 #编码区字号
  vertical_correction: -5
  vertical_gap: 4 #键盘行距
  enter_label_mode: 0 #Enter 文案来源：0只用自己的 enter_labels 表（实测 2 会让所有 App 都退回 default，等于表失效），1只用 App 的 ActionLabel，2优先 App 的，3 App 的只做兜底
  enter_labels: # Enter 键文案（按 App 上报的 IME 动作取；没有动作时用 default）
    go: 前往 #IME_ACTION_GO：浏览器地址栏 / 搜索提交
    search: 搜索 #IME_ACTION_SEARCH：应用内搜索框
    send: 发送 #IME_ACTION_SEND：短信 / 邮件
    next: 下个 #IME_ACTION_NEXT：表单下一项
    pre: 上个 #IME_ACTION_PREVIOUS：表单上一项
    done: 完成 #IME_ACTION_DONE：单行输入结尾
    default: 换行 #无动作（多行文本、正文编辑器等）

preedit: #预编辑文本视图参数
  horizontal_padding: 8 #横向内边距
  top_start_radius: 8 #上端圆角
  top_end_radius: 8 #上端圆角
  foreground: #前景样式
    font_size: 16 #预编辑字号

window: #候选窗口（悬浮窗）参数
  insets: #窗口内边距
    vertical: 4 #纵向内边距
    horizontal: 6 #横向内边距
  item_padding: #候选项内边距
    horizontal: 6 #横向内边距
  foreground: #前景样式
    label_font_size: 16 #序号字号
    text_font_size: 20 #候选字号
    comment_font_size: 10 #注释字号（对齐“标准”的回显大小）

fallback_colors:
  candidate_text_color: text_color

