  VOLUME_UP: { label: 音量+, send: VOLUME_UP }
  VOLUME_MUTE: { label: 静音, send: VOLUME_MUTE }
  # 编辑
  Shift_L: { label: "▲", functional: false, send: Shift_L }
  Shift_L3: { label: "▲", functional: false, send: Shift_L, shift_lock: click }
  Return:
    { label: enter_labels, preview: "↩", functional: false, send: Return }
  Return1: { label: "确定", preview: "↩", functional: false, send: Return }
  Hide: { label: 隐藏, send: BACK }
  BackSpace:
    { label: "⌫", repeatable: true, functional: false, send: BackSpace }
  BackSpace2:
    { label: "⌫", repeatable: true, functional: false, send: BackSpace, slide_delete: true }
  space:
    {
      repeatable: true,
      preview: "⎵",
      functional: false,
      label: "＿＿＿",
      send: space,
      slide_cursor: true,
    }
  space1:
    {
      repeatable: true,
      label: "⎵",
      functional: false,
      send: space,
      slide_cursor: true,
    }
  # 数字区空格：不带 repeatable / slide_cursor，好让键级的长按、上滑生效（输出 C）
  space_c:
    {
      label: "⎵",
      functional: false,
      send: space,
    }
  # 光标区的空格：点按＝空格，键面是一条与字母区同风格的长横
  space_tab:
    {
      label: "＿＿",
      functional: false,
      send: space,
    }
  Clear: { label: 清空, send: Clear }
  Escape: { label: 取消, functional: false, send: Escape }
  Home: { label: Home, send: Home, functional: false }
  Insert: { label: 插入, send: Insert }
  Delete: { label: Delete, send: Delete, functional: false }
  End: { label: End, send: End, functional: false }
  # 光标区用的中文标签版（内置同名键的英文 label 会盖掉键级 label，所以另起预设名）
  Home_cn: { label: Home, functional: false, send: Home }
  End_cn: { label: End, functional: false, send: End }
  Delete_cn: { label: 删除, functional: false, send: Delete }
  Doc_Home: { label: 文首, send: Control+Home, functional: false }
  Doc_End: { label: 文末, send: Control+End, functional: false }
  Page_Up: { label: 上页, send: Page_Up, functional: false }
  Page_Down: { label: 下页, send: Page_Down, functional: false }
  Left: { label: "←", send: Left, repeatable: true, functional: false }
  Down: { label: "↓", send: Down, repeatable: true, functional: false } #repeatable 才有长按连发
  Up: { label: "↑", send: Up, repeatable: true, functional: false } #repeatable 才有长按连发
  Right: { label: "→", send: Right, repeatable: true, functional: false }
  select_all: { label: 全选, functional: false, send: Control+a }
  CtrlP: { label: 拆字, functional: false, send: Control+p }
  CtrlL: { label: 拆字, functional: false, send: Control+l }
  # I 下滑：把当前候选的「注释」直接上屏
  # 例：a → 候选「啊」→ 下滑 P 拆字成注释「kk 口可」→ 下滑 I 把这串注释打出去
  # 实现走 lua/commit_comment.lua（key_binder 的 send: commit_comment 实测无效）
  CtrlJ: { label: 注释, functional: false, send: Control+j }
