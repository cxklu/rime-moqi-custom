    key_back_color: 0x252C36 #按键背景
    key_border_color: 0x333D4B #按键边框
    key_text_color: 0xE4EAF2 #按键文字
    key_symbol_color: 0x8C99A8 #长按符号/助记符

    # ── 功能键的两态（配合 shift_lock / ctrl_lock 的锁定态）──
    on_key_back_color: 0x2F6DA8 #开启态背景
    on_key_border_color: 0x4C9BE8 #开启态边框
    on_key_text_color: 0xFFFFFF #开启态文字
    on_key_symbol_color: 0xCFE2F5 #开启态符号
    off_key_back_color: 0x1F252E #关闭态背景
    off_key_border_color: 0x2B3341 #关闭态边框
    off_key_text_color: 0x9AA7B6 #关闭态文字
    off_key_symbol_color: 0x6C7887 #关闭态符号

    # ── 按下（高亮）的按键 ──
    hilited_key_back_color: 0x3A4658 #按下背景
    hilited_key_border_color: 0x4C9BE8 #按下边框
    hilited_key_text_color: 0xFFFFFF #按下文字
    hilited_key_symbol_color: 0xC2D6EA #按下符号
    hilited_on_key_back_color: 0x3D86C9
    hilited_on_key_border_color: 0x6FB3E8
    hilited_on_key_text_color: 0xFFFFFF
    hilited_on_key_symbol_color: 0xDCEBF9
    hilited_off_key_back_color: 0x2B3341
    hilited_off_key_border_color: 0x475365
    hilited_off_key_text_color: 0xC6D0DC
    hilited_off_key_symbol_color: 0x8C99A8

    # ── 按键气泡 / 长按弹窗 ──
    popup_back_color: 0x1F252E #气泡背景
    popup_text_color: 0xE4EAF2 #气泡文字
    hilited_popup_back_color: 0x2F6DA8 #气泡选中背景
    hilited_popup_text_color: 0xFFFFFF #气泡选中文字

    # ── 键盘区 / 液体键盘 / 长文本（剪贴板）──
    keyboard_back_color: 0x10141A #键盘区背景
    keyboard_background: 0x10141A #键盘区背景图/色
    liquid_keyboard_background: 0x14181F #液体键盘背景
    root_background: 0x10141A #键盘+候选栏整体背景
    shadow_color: 0x000000 #按键阴影
    long_text_back_color: 0x1F252E #长文本按键背景（剪贴板）
    long_text_color: 0xE4EAF2 #长文本按键文字

    # ── 本主题键盘布局引用的一组功能键色（key_back_color: bc1..bc4）──
    bc1: 0x2A3442 #shift
    tc1: 0xD8E2EE
    bc2: 0x46303A #BackSpace（偏红暗色，呼应删除语义）
    tc2: 0xF0D9DF
    bc3: 0x2E3A4A #space
    tc3: 0xE8EFF7
    bc4: 0x2F6DA8 #enter（用主色）
    tc4: 0xFFFFFF

liquid_keyboard:
  # 目前只能直接写参数，不支持变量或者fallback机制。
  # 缺少参数时，自动从style中加载参数。除非需要指定liquid_keyboard使用与主键盘不同的背景色、背景图，否则不应设置被注释掉的参数。
  author: "tumuyan"
  row: 6 #每屏最多显示多少行按键
  row_land: 5 #横屏每屏最多显示多少行按键
  key_height: 20 #按键高度
  key_height_land: 40 #横屏模式按键高度
  single_width: 50 #single类型的按键宽度
  vertical_gap: 2 #纵向按键间隙
  margin_x: 4 #左右按键间隙的1/2
  fixed_key_bar: # 固定按键条
    position: bottom # 摆放位置（在滚动区域的……） top|bottom|left|right
    keys: # 按键（显示名称为对应的label，不能放太多）
