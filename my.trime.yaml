  # 打开安卓系统设置（同文自己的设置页是上面的 Settings，这个才是 System Settings）
  # option 为「包名/组件名」，主设置页绝大多数 ROM 都是 com.android.settings/.Settings
  # 若无效，可依次换成：option: "com.android.settings"（只给包名，走启动器入口）
  #                   option: "android.settings.SETTINGS"（若同文把 option 当 action 发）
  #                   option: "android.settings.INPUT_METHOD_SETTINGS"（直接到「语言和输入法」）
  SysSettings:
    {
      label: 系统,
      send: function,
      command: run,
      option: "com.android.settings/.Settings",
    }
  # 开发者选项
  # ⚠️ 实测：同文的 `run` 只认「包名/组件名」，**不认 action 字符串**
  #    （曾试 option: "android.settings.APPLICATION_DEVELOPMENT_SETTINGS" → 弹条能选中但点了没反应）
  # 组件名两台实测一致（IQOO/OriginOS 与 Redmi/HyperOS 都解析到同一个）：
  #    cmd package resolve-activity -a android.settings.APPLICATION_DEVELOPMENT_SETTINGS
  #    → com.android.settings/.Settings$DevelopmentSettingsActivity
  # 换 ROM 若失效，用上面那条命令重新解析即可
  DevSettings:
    {
      label: 开发者,
      send: function,
      command: run,
      option: "com.android.settings/.Settings$DevelopmentSettingsActivity",
    }
