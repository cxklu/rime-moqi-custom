liquid_keyboard:
  # 目前只能直接写参数，不支持变量或者fallback机制。
  # 缺少参数时，自动从style中加载参数。除非需要指定liquid_keyboard使用与主键盘不同的背景色、背景图，否则不应设置被注释掉的参数。
  author: "tumuyan"
  row: 6 #每屏最多显示多少行按键
  row_land: 5 #横屏每屏最多显示多少行按键
  key_height: 20 #按键高度
  key_height_land: 40 #横屏模式按键高度
  single_width: 50 #single类型的按键宽度
  vertical_gap: 8 #纵向按键间隙
  margin_x: 4 #左右按键间隙的1/2
  fixed_key_bar: # 固定按键条
    position: bottom # 摆放位置（在滚动区域的……） top|bottom|left|right
    keys: # 按键（显示名称为对应的label，不能放太多）
      - liquid_keyboard_exit
      - space
      - BackSpace
  keyboards: [
      history,
      ascii,
      cn,
      emoji,
      yanwenzi,
      clipboard,
      math,
      unit,
      pinyin,
      grease,
      exit,
    ] #tab列表
  exit:
    name: 返回
    type: NO_KEY
    keys: EXIT
  history:
    name: 常用
    type: HISTORY
  clipboard:
    type: CLIPBOARD
    name: 剪贴
  math: #tab名称
    type: SINGLE
    name: 数学
    keys: "≈＝≠≌<>≤≥≡()[]{}-+±×*/÷&∥%‰‱°′″∫∮∯∬∭∰∞∑∧∏∈∵∴⊥∝∨∪•√〒∝∽∈∩∧⊙⌒∥∟∣∂∆∞≌∉∪∨⊕⊿⊥∠∫∬∭" #tab中的按键列表
  emoji:
