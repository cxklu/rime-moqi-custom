  # 打开安卓系统设置（同文自己的设置页是上面的 Settings，这个才是 System Settings）
  # option 为「包名/组件名」，主设置页绝大多数 ROM 都是 com.android.settings/.Settings
  # 若无效，可依次换成：option: "com.android.settings"（只给包名，走启动器入口）
  #                   option: "android.settings.SETTINGS"（若同文把 option 当 action 发）
  #                   option: "android.settings.INPUT_METHOD_SETTINGS"（直接到「语言和输入法」）
  SysSettings:
    {
      label: 系统,
      send: function,
      command: run,
      option: "com.android.settings/.Settings",
    }
  # 开发者选项
  # ⚠️ 实测：同文的 `run` 只认「包名/组件名」，**不认 action 字符串**
  #    （曾试 option: "android.settings.APPLICATION_DEVELOPMENT_SETTINGS" → 弹条能选中但点了没反应）
  # 组件名两台实测一致（IQOO/OriginOS 与 Redmi/HyperOS 都解析到同一个）：
  #    cmd package resolve-activity -a android.settings.APPLICATION_DEVELOPMENT_SETTINGS
  #    → com.android.settings/.Settings$DevelopmentSettingsActivity
  # 换 ROM 若失效，用上面那条命令重新解析即可
  DevSettings:
    {
      label: 开发者,
      send: function,
      command: run,
      option: "com.android.settings/.Settings$DevelopmentSettingsActivity",
    }
  # 收起/展开全键盘的小字（两个槽分开控制，各是开关）
  HideSymbols:
    { label: 隐藏, send: function, command: switch_hide_key_symbol }
  HideHints:
    { label: 注解, send: function, command: switch_hide_key_hint }
  # trime命令
  Deploy: { label: 部署, command: apply, option: "DEPLOY" } #重新部署：重建 build/，等价于设置页右上角 ↶（工具栏已不放此按钮，需要时从 Enter 上滑 → 同文设置里按）
  Sync: { label: 同步, command: apply, option: "SYNC_USER_DATA" } #同步：外部存储 → 私有目录 的改动搬运 + 合并各设备 userdb 快照 + 重启引擎 —— PC 改完配置后按这一下
  UpdateConfig: { label: 更新配置, command: apply, option: "UPDATE_CONFIG" } #更新配置：只重启引擎、重读配置，不做 外部存储 → 私有目录 的同步。实测(2026-10-16)：PC 的改动只到外部存储时按它无效，所以工具栏不放这个按钮；想加回工具栏就在 tool_bar 段补一个 action: UpdateConfig 的按钮锚点、再写进 buttons 列表
  Date: { label: 日期, send: function, command: date, option: " yyyy-MM-dd " }
  Time: { label: 時間, send: function, command: date, option: "HH:mm:ss" } #時間： date 格式
  TrimeApp: {
      label: 同文,
      send: function,
      command: run,
      option: "com.osfans.trime",
    } #運行程序: run 包名
  TrimeCmp: {
      label: 同文組件,
      send: function,
      command: run,
      option: "com.osfans.trime/.Pref",
    } #運行程序指定組件: run 包名/組件名
  Homepage: {
      label: 同文主頁,
      send: function,
      command: run,
      option: "https://github.com/osfans/trime",
    } #查看網頁: run 網址
  Wiki: {
