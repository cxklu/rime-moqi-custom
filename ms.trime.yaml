# 工具栏
tool_bar:
  button_spacing: 5 # 按钮间距

  # 左侧固定主按钮配置
  primary_button:
    # 背景样式设置
    background:
      type: circle # 高亮形状 (可选值: circle|rectangle)
      corner_radius: 10 # 圆角半径
      bg_normal: 0x00 # 正常状态背景颜色
      bg_highlight: hilited_candidate_button_color # 高亮状态背景色
      vertical_inset: 4 # 垂直方向内缩量
      horizontal_inset: 0 # 水平方向内缩量
    # 前景内容设置
    foreground:
      style: "ic@dots_horizontal" # 内置质感设计图标样式（以ic@开头）
      fg_normal: candidate_text_color # 正常状态前景色 (本地图片不允许着色)
      padding: 10 # 前景内容与背景边界的内边距
    # 按钮点击事件
    action: menu_keyboard

  hide_button: &hide_button
    foreground:
      style: "ic@keyboard_close"
      fg_normal: candidate_text_color
    action: Hide

  emoji_button: &emoji_button
    foreground:
      style: "ic@emoticon"
    # 前景样式可以为空，使用默认样式，按钮将显示为 action 的 label
    action: liquid_keyboard_emoji

  clipboard_button: &clipboard_button
    foreground:
      style: "ic@clipboard"
    action: clipboard_window

  ascii_mode_button: &ascii_mode_button
    foreground:
      option_styles: ["中", "En"] # 样式也可以为表，将根据 action 的 toggle 决定
      font_size: 18 # 按钮字体大小
      padding: 10
    action: Mode_switch

  move_button: &move_button
    foreground:
      style: "ic@cursor_text"
    action: Keyboard_move

  menu_button: &menu_button
    foreground:
      style: "ic@translate"
    action: Menu

  # 右侧按钮列表（从右向左排列）
  buttons:
    [
      *hide_button,
      *emoji_button,
      *clipboard_button,
      *move_button,
      *ascii_mode_button,
      *menu_button,
    ]

#键盘布局
preset_keyboards:
  default:
    author: "暖暖"
    name: 26键默认布局
    width: 10
    height: 40
    label_transform: uppercase
    ascii_mode: 0
    keys:
      - { click: q, long_click: 1, swipe_up: "1" }
      - { click: w, long_click: 2, swipe_up: "2" }
      - { click: e, long_click: 3, swipe_up: "3" }
      - { click: r, long_click: 4, swipe_up: "4" }
      - { click: t, long_click: 5, swipe_up: "5" }
      - { click: y, long_click: 6, swipe_up: "6" }
      - { click: u, long_click: 7, swipe_up: "7" }
      - { click: i, long_click: 8, swipe_up: "8" }
      - { click: o, long_click: 9, swipe_up: "9", swipe_down: CtrlO }
      - { click: p, long_click: 0, swipe_up: "0" }

      - { width: 5 }
      - { click: a, long_click: select_all, swipe_up: select_all }
      - { click: s, long_click: "+", swipe_up: "+" }
      - { click: d, long_click: "-", swipe_up: "-" }
      - { click: f, long_click: CtrlF, swipe_up: CtrlF }
      - { click: g, long_click: "*", swipe_up: "*" }
      - { click: h, long_click: CtrlH, swipe_up: CtrlH }
      - { click: j, long_click: "（）{Left}", swipe_up: "(){Left}" }
      - { click: k, long_click: "|", swipe_up: "|" }
      - { click: l, long_click: ";", swipe_up: ";" }
      - { width: 5 }

      - { click: Shift_L, double_click: Shift_L3, width: 15, key_back_color: bc1, key_text_color: tc1 }
      - { click: z, long_click: CtrlP, swipe_up: CtrlP }
      - { click: x, long_click: cut, swipe_up: cut }
      - { click: c, long_click: copy, swipe_up: copy }
      - { click: v, long_click: paste, swipe_up: paste }
      - { click: b, long_click: ":", swipe_up: ":" }
      - { click: n, long_click: "\\", swipe_up: "\\" }
      - { click: m, long_click: "_", swipe_up: "_" }
      - { click: BackSpace2, width: 15, key_back_color: bc2, key_text_color: tc2, swipe_up: Escape, swipe_down: undo }

      - { click: Keyboard_number, long_click: Color_switch, swipe_up: Color_switch, width: 12.5 }
      - { click: ",", long_click: ".", swipe_up: ".", width: 15 }
      - { click: space, long_click: Mode_switch, swipe_up: Mode_switch, width: 42.5, key_back_color: bc3, key_text_color: tc3 }
      - { click: "/", long_click: "?", swipe_up: "?", width: 15 }
      - { click: Return, composing: Return1, long_click: CtrlE, swipe_up: CtrlE, width: 15, key_back_color: bc4, key_text_color: tc4 }

  number:
    author: "暖暖"
    name: 数字+
    width: 20
    height: 40
    ascii_mode: 1
    keys:
      - { click: "/", long_click: "[]{Left}", swipe_up: "[]{Left}", width: 13 }
      - { click: "+", long_click: "{}{Left}", swipe_up: "{}{Left}", width: 13 }
      - { click: 1 }
      - { click: 2 }
      - { click: 3 }
      - { click: "=", width: 13 }

      - { click: "*", long_click: "<>{Left}", swipe_up: "<>{Left}", width: 13 }
      - { click: "-", long_click: "《》{Left}", swipe_up: "《》{Left}", width: 13 }
      - { click: 4 }
      - { click: 5 }
      - { click: 6 }
      - { click: ., width: 13 }

      - { click: "%", long_click: "''{Left}", swipe_up: "''{Left}", width: 13 }
      - { click: "×", long_click: '""{Left}', swipe_up: '""{Left}', width: 13 }
      - { click: 7, long_click: select_all }
      - { click: 8, long_click: copy }
      - { click: 9, long_click: paste_clip, swipe_down: paste }
      - {
          click: BackSpace,
          width: 13,
          key_back_color: bc2,
          key_text_color: tc2,
        }

      - { click: Keyboard_default, width: 13 }
      - { click: "÷", long_click: "……", swipe_up: "……", width: 13 }
      - { click: liquid_keyboard_switch, long_click: Color_switch, key_back_color: bc1, key_text_color: tc1 }
      - { click: 0, long_click: cut }
      - { click: space1, key_back_color: bc3, key_text_color: tc3 }
      - { click: Return, width: 13, key_back_color: bc4, key_text_color: tc4 }

  move:
    author: "暖暖"
    name: 光标控制
    width: 20
    height: 40
    ascii_mode: 1
    keys:
      - { click: select_all, label: 全选 }
      - { click: Doc_Home, label: Home }
      - { click: Up, label: "↑", repeatable: true }
      - { click: Doc_End, label: End }
      - { click: paste, label: 粘贴, key_back_color: bc4, key_text_color: tc4 }

      - { click: cut, label: 剪切 }
      - { click: Left, label: "←", repeatable: true, long_click: Left1, swipe_up: Left1 }
      - { click: Shift_L2, label: 选择 }
      - { click: Right, label: "→", repeatable: true, long_click: Right1, swipe_up: Right1 }
      - { click: Delete, label: Delete, long_click: DeleteCandidate, swipe_up: DeleteCandidate }

      - { click: copy, label: 复制 }
      - { click: Home, label: 行首 }
      - { click: Down, label: "↓" }
      - { click: End, label: 行尾 }
      - { click: BackSpace, label: "⌫", repeatable: true, long_click: CtrlBackspace, swipe_up: CtrlBackspace, key_back_color: bc2, key_text_color: tc2 }

      - { click: Keyboard_default, label: "返回", key_back_color: bc1, key_text_color: tc1 }
      - { click: undo, label: 撤销 }
      - { click: space, label: "⎵", repeatable: true, long_click: Tab, swipe_up: Tab, key_back_color: bc3, key_text_color: tc3 }
      - { click: redo, label: 重做 }
      - { click: Return, label: Enter, key_back_color: bc4, key_text_color: tc4 }

