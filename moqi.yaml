switches_engine:  
  switches:
    - name: ascii_mode
      states: [ 中文, 英文 ]
    - name: full_shape
      states: [ 半角, 全角 ]
    - name: traditionalization
      states: [ 简, 繁 ]
    - name: emoji
      states: [ 💀, 😄 ]
    - name: chaifen
      states: [ 不拆, 扌斥 ]
    # 小字集 / 大字集。开关名必须是 extended_charset，这是 librime 内置识别的名字：
    # 关闭时 charset_filter（见下面 engine/filters）会滤掉含「扩展区汉字」的候选项
    # —— CJK 扩展 A~J 区、兼容汉字区，这些字手机端常常没字体、显示成方块。
    - name: extended_charset
      reset: 0
      states: [ 小字集, 大字集 ]
    - name: mars
      reset: 0
      states: [ 地, 煋 ] #火星文
    - name: ascii_punct
      states: [ 。，, ．， ]

  engine:
    processors:
      - ascii_composer
      - recognizer
      - lua_processor@*sbxlm.key_binder # 绑定按键
      # 注释上屏：把当前选中候选的注释直接打出去（I 下滑 → Control+j）
      # 排在 key_binder 前面，避免被它抢走；两端（Trime/小狼毫）都走这一处
      - lua_processor@*commit_comment
      # Shift+字母 给第一个音加辅码：同文把 Shift+字母合成成大写字符，
      # 内置 key_binder 匹配不到 Shift+C，由本处理器补上（小狼毫不受影响）
      - lua_processor@*aux_shift
      # Shift+Enter（同文 ▲+Enter）在 Obsidian 表格里插入 <br> 换行
      - lua_processor@*shift_enter
      - key_binder
      - speller
      - punctuator
      - selector
      - navigator
      - express_editor
    segmentors:
      - ascii_segmentor
      - matcher
      - abc_segmentor
      - punct_segmentor
      - affix_segmentor@emojis

      # 反查方案 去掉前缀
      - affix_segmentor@reverse_moqima
      - affix_segmentor@radical_flypy
      - affix_segmentor@reverse_stroke
      - affix_segmentor@reverse_zrlf
      - affix_segmentor@reverse_cj

      - affix_segmentor@add_user_dict
      - affix_segmentor@verbatim ## not as the last of this list
      - affix_segmentor@easy_en_simp
      - affix_segmentor@jp_sela
      - fallback_segmentor
    translators:
       # lua翻译器
      - lua_translator@*date_translator    # 时间、日期、星期
      - lua_translator@*lunar              # 农历
      - lua_translator@*unicode            # Unicode
      - lua_translator@*card_number
      - lua_translator@*number_translator  # 数字、金额大写
      - lua_translator@*calculator    # 计算器
      - punct_translator
      # 码表翻译器 用于仓颉、五笔等基于码表的输入方案
      - table_translator@custom_phrase # 1、2码置顶
      - table_translator@custom_phrase_3_code # 3码出简让全
      - table_translator@custom_phrase_kf # 快符
      - table_translator@custom_phrase_mqzg # 字根
      - table_translator@custom_phrase_super_1jian # 1、2、3码时的tab上屏词
      - table_translator@custom_phrase_super_2jian
      - table_translator@custom_phrase_super_3jian
      - table_translator@custom_phrase_super_3jian_no_conflict
      - table_translator@custom_phrase_super_4jian_no_conflict
      - table_translator@custom_short # 自定义编码词库（短码/缩写）
      - table_translator@emojis ## 添加注释后：停用ae模式emoji输入
      - table_translator@easy_en_simp ## 添加注释后：停用单词输入
      - table_translator@jp_sela ## 添加注释后：停用日语输入
      # 反查翻译器
      - reverse_lookup_translator
      - table_translator@reverse_moqima
      - table_translator@radical_flypy
      - table_translator@reverse_stroke
      - table_translator@reverse_zrlf
      - table_translator@reverse_cj
      # 脚本翻译器，用于拼音、粤拼等基于音节表的输入方案
      - script_translator
      - script_translator@user_dict_set
      - script_translator@add_user_dict
      
    filters:
      # lua的filter：
      #- lua_filter@*laneChangeAndSpace_Filter   # 把<br>替换为换行
      - lua_filter@*pro_comment_format                #超级注释模块，支持错词错音提示、任意长度辅助码显示，支持个性化配置和关闭相应的功能，详情搜索pro_comment_format进行详细配置
      - lua_filter@*aux_lookup_filter                 # ` 引导辅助码筛选候选
      # 四字词 4 码反查：C++ 侧读 super4.dict.yaml 的 reverse.bin（10.9 万条）。
      # 必须排在 jianma_show 前面，让 Lua 能按单个码去重（见 make_hint）
      - reverse_lookup_filter@fourjian
      - lua_filter@*moqi.jianma_show # 注释回显：超级简拼回显 + 简码反查（纯 txt 驱动，不依赖 reverse.bin）
      - lua_filter@*is_in_user_dict # 用户词典的词加上一个*
      #- lua_filter@*long_word_filter                       # 长词优先（顺序要求：长词优先 > Emoji）
      # - lua_filter@*moran_debug_filter # debug

      # 反查的filter
      - reverse_lookup_filter@reverse_lookup

      - simplifier@emoji                              # Emoji
      # - lua_filter@*reduce_emoji_filter   # 按需启用，作用是降低Emoji在候选项中的位置排序(顺序要求：Emoji > 降低排序)
      - simplifier@chaifen
      - simplifier@chaifen_all
      - simplifier@chinese_english
      - simplifier@traditionalize                     # 简繁切换
      - simplifier@mars                               #火星文
      # 小字集/大字集：extended_charset 关闭时，过滤掉含扩展区汉字的候选
      # （手机端没字体的生僻字）。词条本身不删，切回「大字集」立刻回来。
      # 放链尾：让前面过滤器后加进来的候选也一并过滤（例如 火星文/拆字 简化器）。
      # 实测把它挪到链首并不降低 CPU——卡顿来自候选池本身要拉多深（`zl` 会拉出
      # 上万条生僻字候选），不是后面过滤器处理它们，所以按正确性优先放链尾。
      # 注：不用 librime 内置的 charset_filter，理由见 lua/charset_filter.lua 顶部。
      - lua_filter@*charset_filter
      # 超级简拼兜底：必须站在 charset_filter 之后。jianma_show 只给「它眼里的
      # 第一个候选」写注释，而那个候选可能是生僻字、随即被 charset_filter 丢掉，
      # 超级简拼就跟着一起没了（hyl = 行业里 曾经完全不出候选就是这原因）。
      # 这里看到的首个候选才是真正会显示的那个；一个都没有时自己造一个 ⚡ 候选。
      - lua_filter@*super_tail
      - uniquifier

# grammar:                                 # 禁用语言模型（固定词频模式下不需要上下文预测）
#   language: zh-moqi
#   non_collocation_penalty: -4

octagram:
  disable:
    __patch:
      grammar: {}
  enable_for_sentence:
    __patch:
      grammar:
        # language: fcitx-zh-hans # 小企鹅模型
        # language: zh-hans-t-huayu-v7-bgw # 华宇模型
        # language: zh-hans-wiki-202405 # 维基模型
        # language: zh-hans-t-essay-bgw # rime官方模型
        language: zh-moqi # 墨奇训练的模型 聊胜于无 主要目的是让non_collocation_penalty生效
        # collocation_max_length: 5
        # collocation_min_length: 2
        non_collocation_penalty: -4
        # collocation_penalty: -4
        # weak_collocation_penalty: -12
        # rear_penalty: -18
      translator/contextual_suggestions: true # 是否使用语言模型优化输出结果〔需配合 grammar 使用〕
      translator/max_sentences: 3
      translator/max_homophones: 4 # 最大同音簇长度〔需配合 grammar 使用〕
      translator/max_homographs: 2 # 最大同形簇长度〔需配合 grammar 使用〕
phrase:
  custom_phrase:
    dictionary: ""
    user_dict: custom_phrase/custom_phrase
    db_class: stabledb
    enable_completion: false
    enable_sentence: false
    initial_quality: 100000

  # 无冲突的3简
  custom_phrase_super_3jian_no_conflict:
    dictionary: ""
    user_dict: custom_phrase/custom_phrase_super_3jian_no_conflict
    db_class: stabledb
    enable_sentence: false
    enable_completion: false
    initial_quality: -1 #本表词和系统词重码居后

  # 无冲突的4简
  # 四字词 4 码表。原来用 user_dict 读 custom_phrase/custom_phrase_super_4jian_no_conflict.txt，
  # 现在改成 dictionary: super4 —— 内容一样（super4.dict.yaml 由那张 txt 生成），但换来两件事：
  #   1. 会被编译出 build/super4.reverse.bin，供 reverse_lookup_filter@fourjian 做四字词 4 码反查
  #   2. 引擎创建时由「解析 1.9MB 文本」变成加载编译好的 table.bin，快得多
  # 代价：改那张 txt 不再重启即生效，需要重新生成 super4.dict.yaml
  #       （见 README「反查：一二三简码与自定义词库走 Lua」）后再部署
  custom_phrase_super_4jian_no_conflict:
    dictionary: super4
    enable_sentence: false
    enable_completion: false
    initial_quality: -1 #本表词和系统词重码居后
    # initial_quality: 1 #比系统词靠前，比无词靠后  等后面4jian_no_conflict只留下成语和常用词，再改为1

  # 自定义编码词库（短码/缩写）
  custom_short:
    dictionary: ""
    user_dict: custom_phrase/custom_short
    db_class: stabledb
    enable_completion: false
    enable_sentence: false
    initial_quality: 50000

  # 快符
  custom_phrase_kf:
    dictionary: ""
    user_dict: custom_phrase/custom_phrase_kf
    db_class: stabledb
    enable_sentence: false
    enable_completion: false
    initial_quality: -1 #本表词和系统词重码居后

  # 字根
  custom_phrase_mqzg:
    dictionary: ""
    user_dict: custom_phrase/custom_phrase_mqzg
    db_class: stabledb
    enable_sentence: false
    enable_completion: false
    initial_quality: -1 #本表词和系统词重码居后

  # 超强tab 1码
  custom_phrase_super_1jian:
    dictionary: ""
    user_dict: custom_phrase/custom_phrase_super_1jian
    db_class: stabledb
    enable_sentence: false
    enable_completion: false
    initial_quality: -1 #本表词和系统词重码居后

  # 超强tab 2码
  custom_phrase_super_2jian:
    dictionary: ""
    user_dict: custom_phrase/custom_phrase_super_2jian
    db_class: stabledb
    enable_sentence: false
    enable_completion: false
    initial_quality: -1 #本表词和系统词重码居后

  # 超强tab 3码
  custom_phrase_super_3jian:
    dictionary: ""
    user_dict: custom_phrase/custom_phrase_super_3jian
    db_class: stabledb
    enable_sentence: false
    enable_completion: false
    initial_quality: -1 #本表词和系统词重码居后

reverse:
  reverse_moqima:
    tag: reverse_moqima
    dictionary: reverse_moqima
    enable_completion: true
    prefix: "Zmq"
    suffix: "'"
    tips: 〔墨奇反查〕
    preedit_format:
      # - xlit/hspnz/一丨丿丶乙/

  radical_flypy:
    tag: radical_flypy
    dictionary: radical_flypy # https://github.com/mirtlecn/rime-radical-pinyin
    enable_completion: true
    prefix: "Zz"
    suffix: "'"
    tips: 〔部件组字〕
    preedit_format:
      # - xlit/hspnz/一丨丿丶乙/

  reverse_zrlf:
    tag: reverse_zrlf
    dictionary: zrlf
    enable_completion: true
    prefix: "Zlf"
    suffix: "'"
    tips: 〔自然兩分〕
    preedit_format:
      # - xlit/hspnz/一丨丿丶乙/

  reverse_cj:
    tag: reverse_cj
    dictionary: cangjie5
    enable_completion: true
    prefix: "Zcj"
    suffix: "'"
    tips: 〔仓颉〕
    preedit_format:
      - xform/^Zcj/仓颉5:/
      - xlit|abcdefghijklmnopqrstuvwxyz|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符|

  reverse_stroke:
    tag: reverse_stroke
    dictionary: stroke # stroke
    enable_completion: true
    prefix: "Zb"
    suffix: "'"
    tips: 〔筆畫hspnz〕 # 〔筆畫〕
    preedit_format:
      - xlit/hspnz/一丨丿丶乙/

  reverse_lookup:
    tags: [ reverse_moqima,radical_flypy,reverse_stroke,reverse_zrlf,reverse_cj]
    overwrite_comment: true
    # 可以改为全拼+音调+释义的码表
    dictionary: moqi_wan.extended # 提示码词表

  # 四字词 4 码反查：给普通候选补上它的 4 码（如 傲岸不群 -> aabq）
  # 数据来自 super4.dict.yaml（由 custom_phrase_super_4jian_no_conflict.txt 生成，
  # 两边一一对应），走 C++ 的 reverse.bin，不占 Lua 内存
  fourjian:
    tags: [ abc ]             # 只给普通候选打，不碰反查候选
    overwrite_comment: false  # 追加在 jianma_show 的简码后面（Lua 侧会按码去重）
    dictionary: super4
  
opencc_config:
  # 显示墨奇码拆分
  chaifen:
    option_name: chaifen
    opencc_config: moqi_chaifen.json
    tips: char
    show_in_comment: true
    comment_format:
      - "xform/	/ /"

  chaifen_all:
    option_name: chaifen_all
    opencc_config: moqi_chaifen_all.json
    tips: char
    show_in_comment: true
    comment_format:
      - "xform/	/ /"

  #中文转英文
  chinese_english:
    option_name: chinese_english
    opencc_config: chinese_english.json
    tips: char
    comment_format:
      - "xform/-/ /"

  # Emoji
  emoji:
    option_name: emoji
    opencc_config: emoji.json
    inherit_comment: false  # 在 corrector.lua 及反查中，emoji 返回空注释


  # 简繁切换
  traditionalize:
    option_name: traditionalization
    opencc_config: s2t.json  # s2t.json | s2hk.json | s2tw.json | s2twp.json
    tips: none               # 转换提示: all 都显示 | char 仅单字显示 | none 不显示。
    tags: [ abc, number, gregorian_to_lunar ]  # 限制在对应 tag，不对其他如反查的内容做简繁转换

  # 火星文切换
  mars:
    opencc_config: martian.json 
    option_name: mars
    
punctuator:
  # 标点符号
  # punctuator 下面有三个子项：
  #   full_shape 全角标点映射
  #   half_shape 半角标点映射
  #   symbols    Rime 的预设配置是以 '/' 前缀开头输出一系列字符，自定义的 symbols_caps_v.yaml 修改成了 '/' 开头。
  punctuator:
    full_shape:
      __include: default:/punctuator/full_shape  # 从 default.yaml 导入配置
    half_shape:
      __include: default:/punctuator/half_shape  # 从 default.yaml 导入配置
    symbols:
      __include: symbols_caps_v:/symbols         # 从 symbols_caps_v.yaml 导入配置

guide:
  recognizer:
    # import_preset: default
    patterns:
      uppercase: "^[A-Z].*$"
      punct: '^/([0-9]|10|[A-z]+)$'
      ## 拆字、笔画、仓颉: 
      reverse_moqima: "^Zmq[A-Za-z]*$" # 大写 Z 引导，不占小写简码
      radical_flypy: "^Zz[a-z]*$" # 大写 Zz 引导（组字），不占小写简码
      reverse_stroke: "^Zb[A-Za-z]*$" # 大写 Zb 引导（笔画）
      reverse_cj: "^Zcj[A-Za-z]*$" # 大写 Zcj 引导（仓颉）
      reverse_zrlf: "^Zlf[A-Za-z]*$" # 大写 Zlf 引导（自然两分）
      #造词
      add_user_dict: "^Zcy[A-Za-z]*$" # 大写 Zcy 引导（自造词）；用三位，否则会把 Zcj（仓颉）吃掉

      emojis: "^Ze[a-z]*$" # 大写 Ze 引导（Emoji）
      easy_en_simp: "^Zw[a-z]*$" # 大写 Zw 引导（英文）
      jp_sela: "^Zj[a-z]*$" # 大写 Zj 引导（日语）
      card_number: "^C[0-9]+"              # 脚本将自动获取第 2 个字符 C 作为触发前缀
      unicode: "^U[a-f0-9]+"              # 脚本将自动获取第 2 个字符 U 作为触发前缀，响应 lua_translator@unicode，输出 Unicode 字符
      number: "^R[0-9]+[.]?[0-9]*"        # 脚本将自动获取第 2 个字符 R 作为触发前缀，响应 lua_translator@number_translator，数字金额大写
      gregorian_to_lunar: "^N[0-9]{1,8}"  # 脚本将自动获取第 2 个字符 N 作为触发前缀，响应 lua_translator@lunar，公历转农历，输入 N20240115 得到「二〇二三年腊月初五」

  emojis:
    tag: emojis
    dictionary: emoji
    enable_completion: true
    prefix: "Ze"
    tips: " Emoji"

  easy_en_simp:
    tag: easy_en_simp
    dictionary: easy_en
    enable_completion: true
    enable_sentence: false
    prefix: "Zw"
    tips: "英文单词（可去元音）"
    spelling_hints: 9
    comment_format:
      - xform/^.+$//
      
  jp_sela:
    tag: jp_sela
    dictionary: jp_sela
    enable_completion: true
    enable_sentence: false
    prefix: "Zj"
    tips: "日语"
    spelling_hints: 9
    comment_format:
      - xform/^.+$//

  # 计算器触发关键字
  calculator:
    trigger: V

  # Lua 配置: 日期、时间、星期、ISO 8601、时间戳的触发关键字
  date_translator:
    date: date            # 日期： 2022-11-29
    time: time            # 时间： 18:13
    week: week            # 星期： 星期二
    datetime: datetime    # ISO 8601： 2022-11-29T18:13:11+08:00
    timestamp: timestamp  # 时间戳： 1669716794

  # Lua 配置：农历的触发关键字
  lunar: anl  # 农历： 二〇二三年冬月二十 癸卯年（兔）冬月二十
  # Lua 配置：长词优先
  # 提升 count 个词语，插入到第 idx 个位置。
  # 示例：将 2 个词插入到第 1  个候选项，输入 总算 得到「1总算 2纵」
  long_word_filter:
    count: 2
    idx: 1

big_char_and_user_dict:


  user_dict_set:
    dictionary: moqi_wan.extended
    initial_quality: 0
    enable_completion: false
    enable_sentence: false
    ##  默认为不超过 2 个字的候选项显示输入码；将 2 改为 0 可关闭编码提示，
    ##  改为 1 则是只显示单字的输入码，依此类推。
    spelling_hints: 1
    comment_format:
      - "xform/(^|[ '])[^[]+[[]/$1/" ## 编码提示只显示辅助码部分
    enable_user_dict: true # 是否开启自动调频
    user_dict: user.custom.dict
    db_class: tabledb

  # 自定义词典加词(Zcy 引导)
  add_user_dict:
    tag: add_user_dict
    dictionary: moqi_wan.extended
    initial_quality: -1
    user_dict: user.custom.dict
  # ↓ 用户词典格式，tabledb（文本） 或 userdb （二进制）。
    db_class: tabledb
    enable_charset_filter: false # 是否开启字符集过滤
    enable_completion: true # 提前显示尚未输入完整码的字〔仅 table_translator 有效〕
    enable_encoder: true # 是否开启自动造词〔仅 table_translator 有效〕
    enable_sentence: true #  是否开启自动造句
    enable_user_dict: true # 是否开启用户词典
    encode_commit_history: false # 是否对已上屛词自动成词〔仅 table_translator 有效〕
    preedit_format:
      
    comment_format:
      - "xform/(^|[ '])[^[]+[[]/$1/" ## 编码提示只显示辅助码部分
    prefix: "Zcy"
    tips: "〔自造词〕"